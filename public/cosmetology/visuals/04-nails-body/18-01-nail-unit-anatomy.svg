<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Figure 18.1 — Anatomy of the human nail unit</title>
  <desc id="desc">Educational diagram with a top view and longitudinal cross-section of a fingernail. Labels identify the proximal nail fold, eponychium, cuticle, lunula, nail plate, lateral nail folds, free edge, nail matrix, nail bed, and hyponychium.</desc>
  <defs>
    <linearGradient id="plate" x1="0" x2="1">
      <stop offset="0" stop-color="#f6d9d0"/>
      <stop offset="1" stop-color="#fff2ed"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d99b83"/>
      <stop offset="1" stop-color="#b96f58"/>
    </linearGradient>
    <style>
      .bg{fill:#fbfcfe}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .heading{font:700 34px Inter,Arial,sans-serif;fill:#0f172a}
      .sub{font:600 22px Inter,Arial,sans-serif;fill:#334155}
      .label{font:600 20px Inter,Arial,sans-serif;fill:#0f172a}
      .small{font:500 17px Inter,Arial,sans-serif;fill:#475569}
      .leader{stroke:#334155;stroke-width:2.4;fill:none}
      .dot{fill:#0f766e}
      .skin{fill:url(#skin);stroke:#8d4e3f;stroke-width:2}
      .plate{fill:url(#plate);stroke:#b97868;stroke-width:2}
      .bed{fill:#e8a99d;stroke:#b66e63;stroke-width:2}
      .matrix{fill:#d98fbb;stroke:#9f4c81;stroke-width:2}
      .lunula{fill:#fff6f2;stroke:#c58f84;stroke-width:2}
      .cuticle{fill:#f5dfc9;stroke:#b98d63;stroke-width:2}
      .fold{fill:#c98670;stroke:#8d4e3f;stroke-width:2}
      .hypo{fill:#d4a07f;stroke:#946548;stroke-width:2}
      .bone{fill:#ecd9b8;stroke:#b79a6b;stroke-width:2}
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <text class="heading" x="70" y="65">Figure 18.1 — Anatomy of the Human Nail Unit</text>
  <text class="small" x="70" y="98">Top view and longitudinal cross-section. Simplified for cosmetology education; not to scale.</text>

  <rect class="panel" x="55" y="125" rx="24" width="625" height="715"/>
  <rect class="panel" x="720" y="125" rx="24" width="625" height="715"/>
  <text class="sub" x="90" y="175">A. Top view</text>
  <text class="sub" x="755" y="175">B. Longitudinal cross-section</text>

  <!-- TOP VIEW -->
  <path class="skin" d="M210 245 C145 300 145 590 210 675 C285 750 475 750 550 675 C615 590 615 300 550 245 C480 190 280 190 210 245Z"/>
  <path class="plate" d="M255 285 C315 235 445 235 505 285 L520 610 C470 655 290 655 240 610 Z"/>
  <path class="lunula" d="M275 315 C325 278 435 278 485 315 C445 362 315 362 275 315Z"/>
  <path class="cuticle" d="M252 287 C318 250 442 250 508 287" fill="none" stroke="#b98d63" stroke-width="9" stroke-linecap="round"/>
  <path d="M242 610 Q380 640 518 610 L520 650 Q380 683 240 650Z" fill="#fffdfc" stroke="#b97868" stroke-width="2"/>

  <!-- top labels left/right -->
  <path class="leader" d="M255 278 L170 235 L95 235"/><circle class="dot" cx="255" cy="278" r="5"/>
  <text class="label" x="90" y="225">Proximal nail fold</text>

  <path class="leader" d="M270 300 L165 330 L95 330"/><circle class="dot" cx="270" cy="300" r="5"/>
  <text class="label" x="90" y="320">Cuticle</text>

  <path class="leader" d="M328 330 L175 390 L95 390"/><circle class="dot" cx="328" cy="330" r="5"/>
  <text class="label" x="90" y="380">Lunula</text>

  <path class="leader" d="M250 450 L175 470 L95 470"/><circle class="dot" cx="250" cy="450" r="5"/>
  <text class="label" x="90" y="460">Lateral nail fold</text>

  <path class="leader" d="M390 475 L555 435 L635 435"/><circle class="dot" cx="390" cy="475" r="5"/>
  <text class="label" x="535" y="425">Nail plate</text>

  <path class="leader" d="M390 650 L550 690 L635 690"/><circle class="dot" cx="390" cy="650" r="5"/>
  <text class="label" x="540" y="680">Free edge</text>

  <!-- CROSS SECTION -->
  <path class="skin" d="M785 520 C830 480 875 440 915 405 L1190 405 C1240 405 1280 435 1290 475 L1295 620 L780 620Z"/>
  <path class="bone" d="M925 540 C1010 495 1125 495 1210 545 L1190 600 L940 600Z"/>
  <path class="bed" d="M915 420 L1200 420 C1235 420 1250 440 1260 462 L1245 490 L905 490Z"/>
  <path class="matrix" d="M860 430 C885 400 925 387 970 395 L1015 420 L915 445Z"/>
  <path class="plate" d="M895 390 C960 382 1135 382 1248 410 L1280 423 L1278 450 C1150 430 970 428 900 438Z"/>
  <path class="fold" d="M830 365 C860 325 930 330 950 380 L915 420 L858 430Z"/>
  <path class="cuticle" d="M888 383 L950 393" fill="none" stroke="#b98d63" stroke-width="8" stroke-linecap="round"/>
  <path class="hypo" d="M1240 470 C1260 455 1280 455 1295 468 L1295 520 L1250 500Z"/>
  <path class="lunula" d="M957 409 C985 401 1015 404 1040 414 L1010 430 L970 426Z"/>

  <!-- cross labels -->
  <path class="leader" d="M865 360 L790 290 L750 290"/><circle class="dot" cx="865" cy="360" r="5"/>
  <text class="label" x="750" y="280">Proximal nail fold</text>

  <path class="leader" d="M890 380 L800 350 L750 350"/><circle class="dot" cx="890" cy="380" r="5"/>
  <text class="label" x="750" y="340">Eponychium</text>

  <path class="leader" d="M920 390 L820 410 L750 410"/><circle class="dot" cx="920" cy="390" r="5"/>
  <text class="label" x="750" y="400">Cuticle</text>

  <path class="leader" d="M930 420 L820 475 L750 475"/><circle class="dot" cx="930" cy="420" r="5"/>
  <text class="label" x="750" y="465">Nail matrix</text>

  <path class="leader" d="M1010 414 L1080 320 L1160 320"/><circle class="dot" cx="1010" cy="414" r="5"/>
  <text class="label" x="1168" y="310">Lunula</text>

  <path class="leader" d="M1110 410 L1160 250 L1245 250"/><circle class="dot" cx="1110" cy="410" r="5"/>
  <text class="label" x="1168" y="240">Nail plate</text>

  <path class="leader" d="M1100 465 L1190 530 L1285 530"/><circle class="dot" cx="1100" cy="465" r="5"/>
  <text class="label" x="1195" y="520">Nail bed</text>

  <path class="leader" d="M1260 478 L1180 585 L1085 585"/><circle class="dot" cx="1260" cy="478" r="5"/>
  <text class="label" x="975" y="575">Hyponychium</text>

  <path class="leader" d="M1277 435 L1285 365 L1330 365"/><circle class="dot" cx="1277" cy="435" r="5"/>
  <text class="label" x="1210" y="355">Free edge</text>

  <text class="small" x="90" y="790">Top view emphasizes visible landmarks used during consultation, shaping and nail services.</text>
  <text class="small" x="755" y="790">Cross-section shows structures hidden beneath the proximal fold and nail plate.</text>
  <text class="small" x="755" y="820">Terminology is simplified for professional cosmetology; medical usage may vary for eponychium/cuticle.</text>
</svg>