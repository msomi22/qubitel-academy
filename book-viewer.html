<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Viewer — Reusable Component Reference</title>

<!--
  ============================================================================
  BOOK VIEWER — REFERENCE COMPONENT
  ============================================================================
  A realistic, page-turning book reader built with plain HTML/CSS/JS,
  structured so it maps almost 1:1 onto a React component tree.

  REACT MIGRATION GUIDE (read this first)
  ----------------------------------------------------------------------------
  Everything below is written in clearly separated "components" even though
  there is no framework. Each one is a candidate for a real React component
  or hook with (almost) the same name:

    DATA
      `bookData`                →  props passed into <Book data={bookData} />

    STATE / LOGIC  (see <script>, section "3. STATE / CONTROLLER")
      `readerState` + the functions that mutate it
                                →  a `useBookReader(bookData)` custom hook
                                   returning { currentIndex, goNext, goPrev,
                                   goToPage, isAnimating, theme, toggleTheme }

    RENDER FUNCTIONS (see <script>, section "2. RENDER / TEMPLATE FUNCTIONS")
      `renderBlock(block)`      →  <ContentBlock block={block} />
      `renderPageMarkup(page)`  →  <Page data={page} />
      `buildLeaf(...)`          →  <FlipLeaf front={...} back={...} dir={...} />

    DOM STRUCTURE (see <body>)
      .app-toolbar              →  <Toolbar title=... onToggleTheme=... />
      .book-stage > .book       →  <BookStage><Book>...</Book></BookStage>
      .controls                 →  <PageControls .../>
      .jump-dialog               →  <JumpToPageDialog .../>

  In React, `readerState` becomes real component state (useState/useReducer),
  the imperative DOM writes (`el.innerHTML = ...`) become JSX returned from
  render, and `addEventListener` calls become props like `onClick`/
  `onPointerDown`. The animation logic (rotateY leaves, drag-follow) is
  framework-agnostic and can be lifted almost verbatim into a `useEffect`
  or a small class kept outside React and driven by refs.

  CONTENT MODEL
  ----------------------------------------------------------------------------
  A page is just data: { strand, subStrand, blocks: [...] }. `blocks` is an
  array of typed content — this is the extension point for embedding
  anything (text, image, audio, quote, list, or fully custom HTML/components).
  Adding a new block type = adding one case to `renderBlock()` (or, in React,
  one branch in a <ContentBlock> switch).
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   1. RESET & BASE
   ============================================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  background: var(--color-desk-bg);
  color: var(--color-ink);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
h1, h2, h3, p, figure, blockquote, ul, ol, dl { margin: 0; }

/* ============================================================================
   2. DESIGN TOKENS
   Subject-grounded palette: leather binding, gilt page edges, warm paper —
   the material vocabulary of an actual bound book, in two lightness modes.
   ============================================================================ */
:root,
[data-theme="light"] {
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Lora', Georgia, serif;
  --font-ui: 'Inter', system-ui, -apple-system, sans-serif;

  --color-desk-bg: #ddd3bc;
  --color-paper: #f7f1e2;
  --color-paper-2: #f1e9d6;
  --color-paper-shadow: #e4d8bc;
  --color-paper-shadow-2: #d8c9a4;
  --color-ink: #2a2117;
  --color-ink-soft: #6e6353;
  --color-ink-faint: #948a76;
  --color-leather: #5b2a2e;
  --color-leather-dark: #3d1c1f;
  --color-gilt: #977228;
  --color-rule: rgba(42, 33, 23, 0.16);
  --color-rule-soft: rgba(42, 33, 23, 0.08);
  --shadow-color: rgba(35, 22, 10, 0.38);
  --shadow-color-soft: rgba(35, 22, 10, 0.18);
  --focus-ring: #8a5a20;
  --scrollbar-thumb: rgba(42, 33, 23, 0.25);
}

[data-theme="dark"] {
  --color-desk-bg: #0e0c0a;
  --color-paper: #221d17;
  --color-paper-2: #2a231b;
  --color-paper-shadow: #171310;
  --color-paper-shadow-2: #100d0a;
  --color-ink: #e9e0c9;
  --color-ink-soft: #a99c87;
  --color-ink-faint: #7c7262;
  --color-leather: #8a4448;
  --color-leather-dark: #5e2c2f;
  --color-gilt: #d2aa63;
  --color-rule: rgba(233, 224, 201, 0.14);
  --color-rule-soft: rgba(233, 224, 201, 0.07);
  --shadow-color: rgba(0, 0, 0, 0.65);
  --shadow-color-soft: rgba(0, 0, 0, 0.4);
  --focus-ring: #d2aa63;
  --scrollbar-thumb: rgba(233, 224, 201, 0.2);
}

:root {
  --flip-duration: 650ms;
  --flip-duration-fast: 380ms;
  --flip-ease: cubic-bezier(0.4, 0.05, 0.2, 1);
  --radius-page: 3px 10px 10px 3px;
}

@media (prefers-reduced-motion: reduce) {
  :root { --flip-duration: 1ms; --flip-duration-fast: 1ms; }
}

/* ============================================================================
   3. APP SHELL / TOOLBAR
   ============================================================================ */
.app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

.app-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  background: linear-gradient(180deg, var(--color-leather), var(--color-leather-dark));
  color: #f2e6da;
  box-shadow: 0 2px 10px var(--shadow-color-soft);
  position: relative;
  z-index: 5;
}

.app-toolbar__title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.05rem;
  letter-spacing: 0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.theme-toggle {
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.35);
  background: rgba(255, 255, 255, 0.08);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background 0.15s ease;
}
.theme-toggle:hover { background: rgba(255, 255, 255, 0.18); }
.theme-toggle svg { width: 18px; height: 18px; }
.theme-toggle .icon-moon { display: none; }
[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

/* ============================================================================
   4. BOOK STAGE (perspective root)
   ============================================================================ */
.book-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 14px 10px;
  perspective: 1800px;
}

.book {
  position: relative;
  width: 100%;
  max-width: 420px;
  aspect-ratio: 3 / 4.35;
  -webkit-transform-style: preserve-3d;
  transform-style: preserve-3d;
  transform: rotateX(1.5deg);
  border-radius: var(--radius-page);
  background: var(--color-paper);
  touch-action: pan-y; /* allow vertical scroll of the page body; horizontal handled manually */
  box-shadow:
    3px 4px 0 var(--color-paper-shadow),
    6px 8px 0 var(--color-paper-shadow-2),
    0 14px 30px var(--shadow-color);
}

/* Fallback for browsers without aspect-ratio support (or with buggy
   interaction between aspect-ratio and absolutely-positioned children,
   seen on some WebKit versions): keeps the book from collapsing to zero
   height. The aspect-ratio rule above wins wherever it's supported. */
@supports not (aspect-ratio: 1 / 1) {
  .book { height: 0; padding-top: 145%; }
}

/* Decorative spine — only appears once there's room to suggest an open book */
.book__spine {
  display: none;
  position: absolute;
  top: -6px;
  bottom: -6px;
  left: -26px;
  width: 26px;
  border-radius: 8px 0 0 8px;
  background: linear-gradient(90deg, var(--color-leather-dark), var(--color-leather));
  box-shadow: -4px 6px 16px var(--shadow-color-soft);
}

/* Corner "grab" hotspots for quick tap-to-turn, sit in the page margin so
   they never overlap reading content. Also serve as the discoverability
   affordance (a chevron) for the drag-to-turn gesture. */
.book__tapzone {
  position: absolute;
  top: 8%;
  bottom: 8%;
  width: 13%;
  border: none;
  background: transparent;
  cursor: pointer;
  z-index: 4;
  display: grid;
  color: var(--color-ink-faint);
  opacity: 0;
  transition: opacity 0.2s ease, background 0.2s ease;
}
.book__tapzone:hover,
.book__tapzone:focus-visible { opacity: 1; background: var(--color-rule-soft); }
.book__tapzone--prev { left: 0; border-radius: var(--radius-page) 0 0 var(--radius-page); place-items: center start; }
.book__tapzone--next { right: 0; place-items: center end; }
.book__tapzone svg { width: 16px; height: 16px; margin: 0 4px; }

/* ============================================================================
   5. PAGE
   ============================================================================ */
.page {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--color-paper);
  border-radius: var(--radius-page);
  overflow: hidden;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

/* Gutter shadow near the spine edge — reinforces "this is bound" even in
   single-page view. */
.page::before {
  content: "";
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  pointer-events: none;
  background: linear-gradient(to right, rgba(0,0,0,0.16), transparent 7%);
  z-index: 2;
}
[data-theme="dark"] .page::before {
  background: linear-gradient(to right, rgba(0,0,0,0.4), transparent 7%);
}

.page__header {
  flex: none;
  padding: 22px 26px 12px;
  border-bottom: 1px solid var(--color-rule);
}
.page__eyebrow {
  font-family: var(--font-ui);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-gilt);
  margin-bottom: 4px;
}
.page__title {
  font-family: var(--font-display);
  font-size: 1.28rem;
  font-weight: 600;
  line-height: 1.25;
  color: var(--color-ink);
}

.page__body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 18px 26px 20px;
  font-family: var(--font-body);
  font-size: 0.96rem;
  line-height: 1.7;
  color: var(--color-ink);
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}
.page__body::-webkit-scrollbar { width: 5px; }
.page__body::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

/* Faint ruled lines — the literal "book page with lines" texture, subtle
   enough not to fight legibility. Spacing matches the body line-height. */
.page__body--ruled {
  background-image: repeating-linear-gradient(
    to bottom,
    transparent,
    transparent calc(1.7em - 1px),
    var(--color-rule-soft) calc(1.7em - 1px),
    var(--color-rule-soft) 1.7em
  );
  background-position: 0 4px;
}

.page__footer {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 26px 16px;
  border-top: 1px solid var(--color-rule);
  font-family: var(--font-ui);
  font-size: 0.72rem;
  color: var(--color-ink-soft);
  letter-spacing: 0.02em;
}
.page__footer-number {
  font-variant-numeric: oldstyle-nums;
  color: var(--color-gilt);
  font-weight: 600;
}

/* Cover / title page variant */
.page--cover { align-items: center; justify-content: center; text-align: center; }
.page--cover .page__body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  overflow: visible;
}
.page--cover .cover__title {
  font-family: var(--font-display);
  font-size: 1.9rem;
  font-weight: 700;
  line-height: 1.15;
}
.page--cover .cover__rule {
  width: 56px;
  height: 2px;
  background: var(--color-gilt);
}
.page--cover .cover__subtitle {
  font-family: var(--font-body);
  font-style: italic;
  color: var(--color-ink-soft);
  font-size: 0.95rem;
}
.page--cover .cover__author {
  font-family: var(--font-ui);
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-ink-faint);
  margin-top: 10px;
}

/* Blank paper back-face used while a leaf is mid-flip */
.page--blank {
  background: var(--color-paper-2);
  display: grid;
  place-items: center;
}
.page--blank::after {
  content: "";
  width: 60%;
  height: 60%;
  border: 1px solid var(--color-rule-soft);
  border-radius: 2px;
}

/* ============================================================================
   6. CONTENT BLOCKS — the embeddable-content extension point.
   Add a new type by adding a `.block--yourtype` rule + a case in
   `renderBlock()` (or a branch in <ContentBlock> in React).
   ============================================================================ */
.block { margin-bottom: 1.1em; }
.block:last-child { margin-bottom: 0; }

.block--heading {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--color-ink);
}

.block--text { text-align: justify; hyphens: auto; }
.block--text:first-of-type::first-letter {
  font-family: var(--font-display);
  font-size: 2.6em;
  font-weight: 700;
  float: left;
  line-height: 0.8;
  padding: 0.05em 0.08em 0 0;
  color: var(--color-leather);
}
[data-theme="dark"] .block--text:first-of-type::first-letter { color: var(--color-gilt); }

.block--image figure { margin: 0; }
.block--image img {
  width: 100%;
  border-radius: 4px;
  border: 1px solid var(--color-rule);
}
.block--image figcaption {
  margin-top: 6px;
  font-family: var(--font-ui);
  font-size: 0.74rem;
  color: var(--color-ink-soft);
  text-align: center;
  font-style: italic;
}

.block--audio {
  background: var(--color-paper-2);
  border: 1px solid var(--color-rule);
  border-radius: 8px;
  padding: 12px 14px;
}
.block--audio .audio__label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-ui);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--color-ink-soft);
  margin-bottom: 8px;
}
.block--audio .audio__label svg { width: 15px; height: 15px; color: var(--color-gilt); }
.block--audio audio { width: 100%; height: 34px; }

.block--quote {
  border-left: 3px solid var(--color-gilt);
  padding: 2px 0 2px 16px;
  font-family: var(--font-body);
  font-style: italic;
  color: var(--color-ink-soft);
}
.block--quote cite {
  display: block;
  margin-top: 6px;
  font-style: normal;
  font-family: var(--font-ui);
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--color-ink-faint);
}

.block--list ul, .block--list ol { padding-left: 1.3em; }
.block--list li { margin-bottom: 0.35em; }

/* Example of a fully custom block: an activity/callout box built from
   arbitrary markup, proving the slot accepts anything. */
.activity-box {
  background: var(--color-paper-2);
  border: 1px dashed var(--color-gilt);
  border-radius: 8px;
  padding: 14px 16px;
}
.activity-box__label {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-gilt);
  margin-bottom: 8px;
}
.activity-box label { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; font-size: 0.9rem; }
.activity-box details { margin-top: 8px; font-size: 0.85rem; color: var(--color-ink-soft); }
.activity-box summary { cursor: pointer; font-weight: 600; color: var(--color-ink); }

/* ============================================================================
   7. FLIP LEAF (the page-turn animation)
   ============================================================================ */
.flip-leaf {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  width: 100%;
  height: 100%;
  -webkit-transform-style: preserve-3d;
  transform-style: preserve-3d;
  z-index: 3;
  will-change: transform;
  pointer-events: none; /* the leaf is a visual overlay only during animation */
}
.flip-leaf__face {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  width: 100%;
  height: 100%;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  border-radius: var(--radius-page);
  overflow: hidden;
}
.flip-leaf__face--front { transform: rotateY(0deg); }
.flip-leaf__face--back { transform: rotateY(180deg); }

/* A soft moving shade that sweeps across the leaf as it turns, standing in
   for the way real paper catches light while curling. */
.flip-leaf__shade {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, rgba(0,0,0,0.22), transparent 45%, transparent 55%, rgba(0,0,0,0.22));
  opacity: 0;
  pointer-events: none;
}

/* ============================================================================
   8. CONTROLS
   ============================================================================ */
.controls {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
}

.ctrl-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--color-rule);
  background: var(--color-paper);
  color: var(--color-ink);
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 2px 6px var(--shadow-color-soft);
  transition: transform 0.12s ease, opacity 0.15s ease;
}
.ctrl-btn:hover:not(:disabled) { transform: translateY(-1px); }
.ctrl-btn:active:not(:disabled) { transform: translateY(0) scale(0.96); }
.ctrl-btn:disabled { opacity: 0.35; cursor: default; }
.ctrl-btn svg { width: 18px; height: 18px; }

.page-indicator {
  min-width: 130px;
  height: 44px;
  padding: 0 16px;
  border-radius: 22px;
  border: 1px solid var(--color-rule);
  background: var(--color-paper);
  font-family: var(--font-ui);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--color-ink-soft);
  cursor: pointer;
  box-shadow: 0 2px 6px var(--shadow-color-soft);
}
.page-indicator:hover { color: var(--color-ink); }
.page-indicator strong { color: var(--color-gilt); font-variant-numeric: oldstyle-nums; }

/* ============================================================================
   9. JUMP-TO-PAGE DIALOG
   ============================================================================ */
.jump-dialog {
  border: none;
  border-radius: 14px;
  padding: 0;
  background: var(--color-paper);
  color: var(--color-ink);
  box-shadow: 0 20px 50px var(--shadow-color);
  width: min(320px, 90vw);
}
.jump-dialog::backdrop { background: rgba(10, 8, 6, 0.5); }
.jump-dialog form { padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.jump-dialog h2 {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 600;
}
.jump-dialog__row { display: flex; align-items: center; gap: 10px; }
.jump-dialog input[type="number"] {
  width: 70px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--color-rule);
  background: var(--color-paper-2);
  color: var(--color-ink);
  font-family: var(--font-ui);
  font-size: 0.95rem;
}
.jump-dialog input[type="range"] { flex: 1; accent-color: var(--color-gilt); }
.jump-dialog__actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.jump-dialog button[type="submit"],
.jump-dialog button[type="button"] {
  padding: 9px 16px;
  border-radius: 8px;
  border: 1px solid var(--color-rule);
  background: var(--color-paper-2);
  cursor: pointer;
}
.jump-dialog button[type="submit"] {
  background: var(--color-leather);
  border-color: var(--color-leather);
  color: #f2e6da;
  font-weight: 600;
}

/* ============================================================================
   10. ACCESSIBILITY UTILITIES
   ============================================================================ */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}
:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}

/* ============================================================================
   11. RESPONSIVE — tablet / desktop enhancements
   ============================================================================ */
@media (min-width: 700px) {
  .book { max-width: 480px; margin-left: 26px; }
  .book__spine { display: block; }
  .page__title { font-size: 1.4rem; }
  .page--cover .cover__title { font-size: 2.2rem; }
}

@media (min-width: 1024px) {
  .book-stage { padding-top: 40px; }
  .book { max-width: 540px; }
  .app-toolbar { padding: 16px 28px; }
}
</style>
</head>
<body>

<!--
  Root app node. `data-theme` is the single source of truth for theming;
  in React this would be `<div className="app" data-theme={theme}>`.
-->
<div class="app" id="app" data-theme="light">

  <!-- ============================ TOOLBAR ============================ -->
  <header class="app-toolbar">
    <h1 class="app-toolbar__title" id="bookTitleLabel">Loading…</h1>
    <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch to dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>

/* ============================================================================
   2. RENDER / TEMPLATE FUNCTIONS
   Pure functions: data in, HTML string out. In React these become the JSX
   returned by small presentational components.
   ============================================================================ */

/** Minimal escaping for text inserted via template strings. */
function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/**
 * Renders a single content block. This is the extension point for new
 * embeddable content types — add a case here (and matching CSS) for
 * anything beyond text/image/audio/quote/list/custom.
 * React equivalent: <ContentBlock block={block} />
 */
function renderBlock(block) {
  switch (block.type) {
    case 'heading':
      return `<h3 class="block block--heading">${escapeHTML(block.text)}</h3>`;

    case 'text':
      return `<p class="block block--text">${escapeHTML(block.text)}</p>`;

    case 'image':
      return `
        <figure class="block block--image">
          <img src="${block.src}" alt="${escapeHTML(block.alt || '')}" loading="lazy">
          ${block.caption ? `<figcaption>${escapeHTML(block.caption)}</figcaption>` : ''}
        </figure>`;

    case 'audio':
      return `
        <div class="block block--audio">
          <div class="audio__label">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a1 1 0 0 0-1 1v8.18A3 3 0 1 0 13 15V7h4a1 1 0 0 0 0-2h-5a1 1 0 0 0-1 1v0Z"/></svg>
            ${escapeHTML(block.label || 'Audio')}
          </div>
          <audio controls src="${block.src}"></audio>
        </div>`;

    case 'quote':
      return `
        <blockquote class="block block--quote">
          ${escapeHTML(block.text)}
          ${block.cite ? `<cite>${escapeHTML(block.cite)}</cite>` : ''}
        </blockquote>`;

    case 'list': {
      const tag = block.ordered ? 'ol' : 'ul';
      const items = block.items.map(item => `<li>${escapeHTML(item)}</li>`).join('');
      return `<div class="block block--list"><${tag}>${items}</${tag}></div>`;
    }

    case 'custom':
      // Caller-supplied markup. In production, sanitize this (e.g. DOMPurify)
      // before insertion, or in React, prefer real components over raw HTML.
      return `<div class="block block--custom">${block.html}</div>`;

    default:
      return '';
  }
}

/**
 * Renders a full page (header + body + footer) as an HTML string.
 * React equivalent: <Page data={pageData} pageNumber={n} bookTitle={..}/>
 */
function renderPageMarkup(pageData, pageNumber, totalPages, bookTitle) {
  if (pageData.isCover) {
    return `
      <div class="page page--cover">
        <div class="page__body">
          <h2 class="cover__title">${escapeHTML(pageData.title)}</h2>
          <div class="cover__rule" aria-hidden="true"></div>
          ${pageData.subtitle ? `<p class="cover__subtitle">${escapeHTML(pageData.subtitle)}</p>` : ''}
          ${pageData.author ? `<p class="cover__author">${escapeHTML(pageData.author)}</p>` : ''}
        </div>
      </div>`;
  }

  const blocksHTML = pageData.blocks.map(renderBlock).join('');

  return `
    <div class="page">
      <header class="page__header">
        <p class="page__eyebrow">${escapeHTML(pageData.strand)}</p>
        <h2 class="page__title">${escapeHTML(pageData.subStrand)}</h2>
      </header>
      <div class="page__body page__body--ruled">${blocksHTML}</div>
      <footer class="page__footer">
        <span class="page__footer-title">${escapeHTML(bookTitle)}</span>
        <span class="page__footer-number">${pageNumber}</span>
      </footer>
    </div>`;
}

/* ============================================================================
   3. STATE / CONTROLLER
   Everything in this section is the imperative stand-in for a
   `useBookReader(bookData)` React hook. `readerState` is the hook's state;
   the functions below are the hook's returned actions.
   ============================================================================ */
const readerState = {
  currentIndex: 0,
  isAnimating: false,
};

const totalPages = bookData.pages.length;

// DOM refs (React: these become element refs or are simply unnecessary,
// since JSX would own this markup directly).
const els = {
  book: document.getElementById('book'),
  pageBase: document.getElementById('pageBase'),
  bookTitleLabel: document.getElementById('bookTitleLabel'),
  pageIndicatorCurrent: document.getElementById('pageIndicatorCurrent'),
  pageIndicatorTotal: document.getElementById('pageIndicatorTotal'),
  btnPrev: document.getElementById('btnPrev'),
  btnNext: document.getElementById('btnNext'),
  tapPrev: document.getElementById('tapPrev'),
  tapNext: document.getElementById('tapNext'),
  btnJump: document.getElementById('btnJump'),
  jumpDialog: document.getElementById('jumpDialog'),
  jumpForm: document.getElementById('jumpForm'),
  jumpInput: document.getElementById('jumpInput'),
  jumpSlider: document.getElementById('jumpSlider'),
  jumpCancel: document.getElementById('jumpCancel'),
  srLive: document.getElementById('srLive'),
  themeToggle: document.getElementById('themeToggle'),
  app: document.getElementById('app'),
};

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/** Renders the resting page into the static base layer. */
function renderBase(index) {
  els.pageBase.innerHTML = renderPageMarkup(bookData.pages[index], index + 1, totalPages, bookData.title);
}

/** Syncs the footer indicator + document title + a11y announcement. */
function updateIndicator(announce) {
  els.pageIndicatorCurrent.textContent = String(readerState.currentIndex + 1);
  els.pageIndicatorTotal.textContent = String(totalPages);
  els.btnPrev.disabled = readerState.currentIndex <= 0;
  els.btnNext.disabled = readerState.currentIndex >= totalPages - 1;
  els.tapPrev.style.visibility = els.btnPrev.disabled ? 'hidden' : 'visible';
  els.tapNext.style.visibility = els.btnNext.disabled ? 'hidden' : 'visible';
  if (announce) {
    els.srLive.textContent = `Page ${readerState.currentIndex + 1} of ${totalPages}`;
  }
}

/**
 * Builds the temporary "flip leaf" overlay used during a page turn.
 * front face = the page currently being left; back face = blank paper.
 * React equivalent: <FlipLeaf dir={dir} frontPage={...} />
 */
function buildLeaf(dir, sourceIndex) {
  const leaf = document.createElement('div');
  leaf.className = 'flip-leaf';
  leaf.style.transformOrigin = dir === 'next' ? 'left center' : 'right center';
  leaf.style.transform = 'rotateY(0deg)';

  const front = document.createElement('div');
  front.className = 'flip-leaf__face flip-leaf__face--front';
  front.innerHTML = renderPageMarkup(bookData.pages[sourceIndex], sourceIndex + 1, totalPages, bookData.title);

  const back = document.createElement('div');
  back.className = 'flip-leaf__face flip-leaf__face--back';
  back.innerHTML = '<div class="page page--blank"></div>';

  const shade = document.createElement('div');
  shade.className = 'flip-leaf__shade';

  front.appendChild(shade.cloneNode());
  leaf.appendChild(front);
  leaf.appendChild(back);
  els.book.appendChild(leaf);
  return leaf;
}

/** Updates the shade overlay opacity to peak mid-turn (progress 0..1). */
function updateShade(leaf, progress) {
  const shade = leaf.querySelector('.flip-leaf__shade');
  if (shade) shade.style.opacity = String(Math.sin(Math.min(progress, 1) * Math.PI) * 0.6);
}

/**
 * Turns exactly one page via a full, button/keyboard-triggered animation.
 * React equivalent: the `goNext` / `goPrev` actions from useBookReader.
 */
/**
 * Runs `onSettle` exactly once, as soon as either happens first:
 *  - the leaf's own `transform` transition genuinely ends, or
 *  - a fallback timer expires.
 * The fallback exists because some WebKit builds can silently fail to fire
 * `transitionend` (e.g. if the "from" and "to" styles get coalesced into a
 * single paint before a transition is actually observed). Without it, a
 * missed event would leave `isAnimating` stuck `true` forever and the leaf
 * permanently covering the page underneath — exactly the "blank page" bug
 * this guards against.
 */
function settleLeaf(leaf, durationMs, onSettle) {
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    leaf.removeEventListener('transitionend', onTransitionEnd);
    clearTimeout(fallbackId);
    onSettle();
  };
  function onTransitionEnd(ev) {
    if (ev.target !== leaf || !/transform/.test(ev.propertyName)) return;
    finish();
  }
  leaf.addEventListener('transitionend', onTransitionEnd);
  const fallbackId = window.setTimeout(finish, durationMs + 150);
}

function turnPage(dir) {
  if (readerState.isAnimating) return;
  const targetIndex = dir === 'next' ? readerState.currentIndex + 1 : readerState.currentIndex - 1;
  if (targetIndex < 0 || targetIndex >= totalPages) return;

  if (prefersReducedMotion) {
    readerState.currentIndex = targetIndex;
    renderBase(targetIndex);
    updateIndicator(true);
    return;
  }

  readerState.isAnimating = true;
  const sourceIndex = readerState.currentIndex;
  renderBase(targetIndex); // destination is already waiting underneath
  const leaf = buildLeaf(dir, sourceIndex);

  // Force a reflow between the leaf's initial transform and the transition
  // we're about to start — without this, some browsers coalesce both style
  // writes into one paint and never actually animate (or fire transitionend).
  void leaf.offsetHeight;

  leaf.style.transition = `transform var(--flip-duration) var(--flip-ease)`;
  const endAngle = dir === 'next' ? -180 : 180;
  leaf.style.transform = `rotateY(${endAngle}deg)`;
  updateShade(leaf, 0.999); // snap shade to full during the click-triggered path

  const durationMs = parseFloat(getComputedStyle(els.book).getPropertyValue('--flip-duration')) || 650;
  settleLeaf(leaf, durationMs, () => {
    leaf.remove();
    readerState.currentIndex = targetIndex;
    readerState.isAnimating = false;
    updateIndicator(true);
  });
}

/**
 * Jumps directly to an arbitrary page. Uses a quick cross-fade rather than
 * a full 3D flip (flipping N intermediate pages would be slow/noisy) —
 * a deliberate, documented simplification.
 */
function jumpToPage(targetIndex) {
  targetIndex = Math.max(0, Math.min(totalPages - 1, targetIndex));
  if (targetIndex === readerState.currentIndex || readerState.isAnimating) return;

  if (prefersReducedMotion) {
    readerState.currentIndex = targetIndex;
    renderBase(targetIndex);
    updateIndicator(true);
    return;
  }

  readerState.isAnimating = true;
  els.pageBase.style.transition = `opacity var(--flip-duration-fast) ease`;
  els.pageBase.style.opacity = '0';
  window.setTimeout(() => {
    readerState.currentIndex = targetIndex;
    renderBase(targetIndex);
    requestAnimationFrame(() => { els.pageBase.style.opacity = '1'; });
    updateIndicator(true);
    window.setTimeout(() => { readerState.isAnimating = false; }, 380);
  }, 380);
}

/* ---- Drag-to-turn (pointer-follow flip) -----------------------------------
   Lets a reader drag from anywhere on the page (excluding interactive
   content like the <audio> control) to peel the page over in real time,
   releasing either completes or cancels the turn. Purely an enhancement
   layered on top of turnPage()'s visual model. */
let dragCandidate = null; // { pointerId, startX, startY }
let drag = null;          // { dir, leaf, targetIndex, lastProgress, lastX, lastT }

const DRAG_COMMIT_DISTANCE = 0.28; // fraction of book width
const DRAG_COMMIT_VELOCITY = 0.6;  // px/ms

function isInteractiveTarget(target) {
  return !!target.closest('button, a, audio, input, select, textarea, [data-no-drag]');
}

function onPointerDown(e) {
  if (readerState.isAnimating) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (isInteractiveTarget(e.target)) return;
  dragCandidate = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY };
}

function beginDrag(dir) {
  const targetIndex = dir === 'next' ? readerState.currentIndex + 1 : readerState.currentIndex - 1;
  const sourceIndex = readerState.currentIndex;
  readerState.isAnimating = true;
  renderBase(targetIndex);
  const leaf = buildLeaf(dir, sourceIndex);
  return { dir, leaf, targetIndex, lastProgress: 0, lastX: null, lastT: null };
}

function onPointerMove(e) {
  if (!dragCandidate || dragCandidate.pointerId !== e.pointerId) return;
  const dx = e.clientX - dragCandidate.startX;
  const dy = e.clientY - dragCandidate.startY;

  if (!drag) {
    if (Math.abs(dx) < 10 || Math.abs(dx) <= Math.abs(dy)) return; // let vertical scroll win
    const dir = dx < 0 ? 'next' : 'prev';
    const targetIndex = dir === 'next' ? readerState.currentIndex + 1 : readerState.currentIndex - 1;
    if (targetIndex < 0 || targetIndex >= totalPages) { dragCandidate = null; return; }
    drag = beginDrag(dir);
  }

  e.preventDefault();
  const width = els.book.clientWidth;
  const progress = Math.max(0, Math.min(1, Math.abs(dx) / width));
  const angle = drag.dir === 'next' ? -180 * progress : 180 * progress;
  drag.leaf.style.transition = 'none';
  drag.leaf.style.transform = `rotateY(${angle}deg)`;
  updateShade(drag.leaf, progress);

  const now = performance.now();
  if (drag.lastX !== null) {
    drag.velocity = Math.abs(dx - drag.lastX) / Math.max(1, now - drag.lastT);
  }
  drag.lastX = dx; drag.lastT = now; drag.lastProgress = progress;
}

function onPointerUp(e) {
  if (dragCandidate && dragCandidate.pointerId !== e.pointerId) return;
  if (!drag) { dragCandidate = null; return; }

  const commit = drag.lastProgress > DRAG_COMMIT_DISTANCE || (drag.velocity || 0) > DRAG_COMMIT_VELOCITY;
  const endAngle = commit ? (drag.dir === 'next' ? -180 : 180) : 0;

  void drag.leaf.offsetHeight; // force reflow, see note in turnPage()
  drag.leaf.style.transition = `transform var(--flip-duration-fast) var(--flip-ease)`;
  drag.leaf.style.transform = `rotateY(${endAngle}deg)`;

  const finishedDrag = drag;
  const durationMs = parseFloat(getComputedStyle(els.book).getPropertyValue('--flip-duration-fast')) || 380;
  settleLeaf(finishedDrag.leaf, durationMs, () => {
    finishedDrag.leaf.remove();
    if (commit) {
      readerState.currentIndex = finishedDrag.targetIndex;
    } else {
      renderBase(readerState.currentIndex); // restore the base under the cancelled leaf
    }
    readerState.isAnimating = false;
    updateIndicator(true);
  });

  drag = null;
  dragCandidate = null;
}

/* ============================================================================
   4. THEME
   ============================================================================ */
function applyTheme(theme) {
  els.app.setAttribute('data-theme', theme);
  els.themeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
  els.themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
}

function initTheme() {
  // No persistence layer by design (kept in-memory only) — wire this to
  // localStorage/your own settings store in a real deployment.
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
}

/* ============================================================================
   5. EVENT WIRING
   In React, each of these becomes a prop (onClick, onPointerDown, ...)
   attached directly in JSX instead of via addEventListener.
   ============================================================================ */
function initEvents() {
  els.btnPrev.addEventListener('click', () => turnPage('prev'));
  els.btnNext.addEventListener('click', () => turnPage('next'));
  els.tapPrev.addEventListener('click', () => turnPage('prev'));
  els.tapNext.addEventListener('click', () => turnPage('next'));

  document.addEventListener('keydown', (e) => {
    if (els.jumpDialog.open) return;
    if (e.key === 'ArrowLeft') turnPage('prev');
    if (e.key === 'ArrowRight') turnPage('next');
    if (e.key === 'Home') jumpToPage(0);
    if (e.key === 'End') jumpToPage(totalPages - 1);
  });

  els.book.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  els.btnJump.addEventListener('click', () => {
    els.jumpInput.max = String(totalPages);
    els.jumpSlider.max = String(totalPages);
    els.jumpInput.value = String(readerState.currentIndex + 1);
    els.jumpSlider.value = String(readerState.currentIndex + 1);
    els.jumpDialog.showModal();
    els.jumpInput.focus();
  });
  els.jumpCancel.addEventListener('click', () => els.jumpDialog.close());
  els.jumpInput.addEventListener('input', () => { els.jumpSlider.value = els.jumpInput.value; });
  els.jumpSlider.addEventListener('input', () => { els.jumpInput.value = els.jumpSlider.value; });
  els.jumpForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const target = parseInt(els.jumpInput.value, 10) - 1;
    els.jumpDialog.close();
    if (!Number.isNaN(target)) jumpToPage(target);
  });
  els.jumpDialog.addEventListener('click', (e) => {
    // Close when clicking the ::backdrop (i.e. outside the form panel)
    const rect = els.jumpDialog.getBoundingClientRect();
    const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
    if (!inside) els.jumpDialog.close();
  });

  els.themeToggle.addEventListener('click', () => {
    const next = els.app.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });
}

/* ============================================================================
   6. INIT
   ============================================================================ */
function init() {
  els.bookTitleLabel.textContent = bookData.title;
  renderBase(readerState.currentIndex);
  updateIndicator(false);
  initTheme();
  initEvents();
}

init();
</script>
</body>
</html>
