name: Cleanup old workflow runs

on:
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 03:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow runs older than 14 days
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const cutoff = new Date();
            cutoff.setUTCDate(cutoff.getUTCDate() - 14);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const oldRuns = runs.filter(run =>
              run.id !== context.runId && new Date(run.created_at) < cutoff
            );

            core.info(`Found ${oldRuns.length} workflow run(s) older than ${cutoff.toISOString()}.`);

            for (const run of oldRuns) {
              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: run.id
              });
              core.info(`Deleted run ${run.id} (${run.name}) from ${run.created_at}`);
            }
