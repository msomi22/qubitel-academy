name: Cleanup old workflow runs

on:
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 03:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Keep only the 10 most recent completed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );

            const completedRuns = runs
              .filter(run => run.status === 'completed' && run.id !== context.runId)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const runsToDelete = completedRuns.slice(10);

            core.info(`Keeping the 10 most recent completed workflow runs and all active runs. Deleting ${runsToDelete.length} older completed run(s).`);

            for (const run of runsToDelete) {
              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: run.id
              });
              core.info(`Deleted run ${run.id} (${run.name}) from ${run.created_at}`);
            }
